name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # pytest comes from the dev dependency group (PEP 735), which pip reads
      # with --group since 25.1; it is not an extra, so ".[dev]" installed nothing.
      # The ocr extra brings numpy, which the OCR tests use to build test pages;
      # they fake the recogniser itself, so no model is downloaded. The fast extra
      # is pymupdf4llm, which the image-path regression test needs.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ocr,fast]" --group dev

      # The suite runs against a fake engine: no API key, no network.
      - name: Test
        run: pytest -q

  gui:
    name: desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[gui]" pytest
      # Real job processes against a fake engine; no display needed.
      - run: pytest -q tests/test_gui_jobs.py tests/test_gui_settings.py tests/test_gui_ui.py tests/test_progress.py
        env:
          QT_QPA_PLATFORM: offscreen

  lint:
    name: black + flake8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install black flake8
      - run: black --check kitab tests
      - run: flake8 kitab tests
